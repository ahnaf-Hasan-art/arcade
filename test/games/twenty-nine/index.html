<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Twenty-nine (29) — Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Tiro+Bangla&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --page:#e8ebf2;
  --paper:#f9fafc;
  --paper-2:#eef1f7;
  --ink:#18203a;
  --ink-soft:#586180;
  --rule:#cfd5e3;
  --cloth:#26336a;
  --cloth-deep:#161e45;
  --cloth-hi:#33448a;
  --thread:#e9b949;
  --thread-soft:rgba(233,185,73,.38);
  --on-cloth:#eef0fa;
  --on-cloth-soft:rgba(238,240,250,.72);
  --face:#fffdf8;
  --face-edge:#d9d2c2;
  --face-soft:#968b73;
  --red:#c0283d;
  --black:#1c2033;
  --madder:#8e2c3b;
  --madder-hi:#b5485a;
  --us:#2a9a8b;
  --them:#d45f75;
  --accent:#a8720b;
  --accent-bg:#e9b949;
  --on-accent:#22180a;
  --shadow:0 12px 32px rgba(20,28,60,.18);
  --font-display:"Tiro Bangla", Georgia, "Times New Roman", serif;
  --font-ui:"Hind Siliguri", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --cw:clamp(44px, 11.5vw, 70px);
  --hw:clamp(48px, 12.6vw, 82px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#0d1122;
    --paper:#151a31;
    --paper-2:#1c223e;
    --ink:#e8eaf4;
    --ink-soft:#9ba3c1;
    --rule:#2b3355;
    --cloth:#1f2b5e;
    --cloth-deep:#10163a;
    --cloth-hi:#2c3b7c;
    --face:#f7f3e9;
    --us:#4cc3b2;
    --them:#ef879a;
    --accent:#e9b949;
    --shadow:0 12px 32px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0d1122;
  --paper:#151a31;
  --paper-2:#1c223e;
  --ink:#e8eaf4;
  --ink-soft:#9ba3c1;
  --rule:#2b3355;
  --cloth:#1f2b5e;
  --cloth-deep:#10163a;
  --cloth-hi:#2c3b7c;
  --face:#f7f3e9;
  --us:#4cc3b2;
  --them:#ef879a;
  --accent:#e9b949;
  --shadow:0 12px 32px rgba(0,0,0,.45);
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--page);
  color:var(--ink);
  font-family:var(--font-ui);
  font-size:15px;
  line-height:1.5;
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent-bg);outline-offset:2px}

/* ---------- header ---------- */
.top{
  max-width:1240px;margin:0 auto;padding:14px 18px 6px;
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.mark{
  width:54px;height:54px;border-radius:14px;flex:none;
  background:var(--cloth);color:var(--thread);
  display:grid;place-items:center;
  font-family:var(--font-display);font-size:26px;line-height:1;padding-top:4px;
  box-shadow:inset 0 0 0 4px var(--cloth), inset 0 0 0 5.5px var(--thread-soft);
  position:relative;
}
.brand h1{font-family:var(--font-display);font-weight:400;font-size:24px;line-height:1.1;margin:0}
.brand p{margin:2px 0 0;color:var(--ink-soft);font-size:13px}
.match{display:flex;flex-direction:column;gap:4px;min-width:250px}
.trackrow{display:grid;grid-template-columns:96px 1fr 30px;align-items:center;gap:8px;font-size:13px}
.trackrow b{font-weight:600;white-space:nowrap}
.trackrow .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.track{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;height:10px}
.track i{background:var(--paper-2);border-radius:2px;border:1px solid var(--rule)}
.track i:nth-child(6){margin-right:3px}
.trackrow.us .track i.on{background:var(--us);border-color:var(--us)}
.trackrow.them .track i.on{background:var(--them);border-color:var(--them)}
.track i.neg{background:repeating-linear-gradient(135deg,var(--ink-soft) 0 2px,transparent 2px 4px)!important;border-color:var(--ink-soft)!important;opacity:.7}
.tools{display:flex;gap:6px}
.btn{
  border:1px solid var(--rule);background:var(--paper);border-radius:10px;
  padding:7px 12px;font-weight:500;font-size:14px;
}
.btn:hover{background:var(--paper-2)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.primary{
  border:0;background:var(--accent-bg);color:var(--on-accent);
  border-radius:10px;padding:8px 16px;font-weight:600;font-size:15px;
}
.primary:hover{filter:brightness(1.05)}
.primary:disabled{opacity:.45;filter:none}

/* ---------- layout ---------- */
.layout{
  max-width:1240px;margin:0 auto;padding:8px 18px 28px;
  display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start;
}
@media (max-width:960px){
  .layout{grid-template-columns:minmax(0,1fr);padding:6px 10px 24px}
  .top{padding:10px 10px 4px;gap:10px}
  .match{order:3;width:100%}
}
.board{display:flex;flex-direction:column;gap:10px;min-width:0}

/* ---------- table ---------- */
.table{
  position:relative;border-radius:28px;overflow:hidden;
  aspect-ratio:16/10.5;min-height:360px;
  background:radial-gradient(120% 90% at 50% 42%, var(--cloth-hi), var(--cloth) 55%, var(--cloth-deep));
  box-shadow:inset 0 0 0 9px var(--cloth-deep), var(--shadow);
  color:var(--on-cloth);
}
@media (max-width:640px){ .table{aspect-ratio:1/1.08;border-radius:22px} }
.table::before{
  content:"";position:absolute;inset:17px;border-radius:18px;pointer-events:none;
  border:2px dashed var(--thread-soft);
}
.table::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.022) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(0deg, rgba(0,0,0,.05) 0 1px, transparent 1px 4px);
}
.seat{position:absolute;z-index:2;display:flex;flex-direction:column;align-items:center;gap:6px}
.seat.n{top:26px;left:50%;transform:translateX(-50%)}
.seat.s{bottom:26px;left:50%;transform:translateX(-50%)}
.seat.w{left:26px;top:50%;transform:translateY(-50%)}
.seat.e{right:26px;top:50%;transform:translateY(-50%)}
@media (max-width:640px){
  .seat.n{top:22px}.seat.s{bottom:22px}.seat.w{left:22px}.seat.e{right:22px}
}
.plate{
  background:rgba(8,12,34,.55);border:1px solid rgba(255,255,255,.13);
  border-radius:12px;padding:5px 10px 6px;min-width:86px;text-align:center;
  transition:box-shadow .2s;
}
.plate.turn{box-shadow:0 0 0 2px var(--thread),0 0 20px rgba(233,185,73,.45);animation:turnglow 1.8s ease-in-out infinite}
@keyframes turnglow{50%{box-shadow:0 0 0 2px var(--thread),0 0 6px rgba(233,185,73,.2)}}
.chip.pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.2);opacity:0}}
.who{display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:14px;line-height:1.3}
.who small{font-weight:400;color:var(--on-cloth-soft);font-size:11px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--us);flex:none}
.plate.them .dot{background:var(--them)}
.chips{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:3px}
.chip{font-size:11px;line-height:1.6;padding:0 7px;border-radius:999px;background:rgba(255,255,255,.13)}
.chip.bid{background:var(--thread);color:var(--on-accent);font-weight:700;font-size:16px;line-height:1.5;padding:1px 12px;margin-top:2px}
@media (max-width:640px){ .chip.bid{font-size:14px;padding:1px 9px} }
.chip.say{background:#fff;color:var(--black);font-weight:600}
.chip.say.pass{background:rgba(255,255,255,.2);color:var(--on-cloth)}
.plate.out{opacity:.55}
.seatrow{display:flex;align-items:center;gap:8px}
.backs{display:flex;padding-left:8px;min-height:20px}
.backs i{
  width:14px;height:20px;margin-left:-8px;border-radius:3px;
  border:1px solid rgba(255,255,255,.55);
  background:
    repeating-linear-gradient(45deg, rgba(233,185,73,.55) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(-45deg, rgba(233,185,73,.55) 0 1px, transparent 1px 4px),
    var(--madder);
}
.tok{
  width:26px;height:36px;border-radius:5px;flex:none;display:grid;place-items:center;
  font-family:var(--font-display);font-size:16px;line-height:1;position:relative;
}
.tok.down{
  border:1.5px solid var(--thread);color:var(--thread);
  background:
    repeating-linear-gradient(45deg, rgba(233,185,73,.35) 0 1px, transparent 1px 4px),
    var(--madder);
}
.tok.up{background:var(--face);color:var(--black);border:1.5px solid var(--thread);font-size:20px}
.tok.up.red{color:var(--red)}
.tok.up.rev span{transform:rotate(180deg)}
.tok.word{width:auto;height:auto;padding:3px 8px;border-radius:999px;background:var(--thread);color:var(--on-accent);font-family:var(--font-ui);font-size:11px;font-weight:600}

/* trick */
.trick{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;
  width:calc(var(--cw) * 3.3);height:calc(var(--cw) * 1.4 * 2.25);
}
.slot{position:absolute}
.slot.s{bottom:0;left:50%;transform:translateX(-50%);--fx:0px;--fy:60px}
.slot.n{top:0;left:50%;transform:translateX(-50%);--fx:0px;--fy:-60px}
.slot.w{left:0;top:50%;transform:translateY(-50%);--fx:-60px;--fy:0px}
.slot.e{right:0;top:50%;transform:translateY(-50%);--fx:60px;--fy:0px}
.slot .card.win{box-shadow:0 0 0 3px var(--thread),0 6px 18px rgba(0,0,0,.4);animation:winlift .5s ease-out forwards}
@keyframes winlift{50%{transform:translateY(-6px) scale(1.06)}100%{transform:translateY(-3px) scale(1.04)}}

/* trump display in the board corner */
.corner{
  position:absolute;left:32px;top:30px;z-index:2;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  --w:clamp(56px, 9.5vw, 84px);
}
@media (max-width:640px){ .corner{left:26px;top:26px} }
.corner.arrive .tface{animation:arrive .55s cubic-bezier(.3,1.5,.5,1)}
@keyframes arrive{0%{transform:scale(1.35)}100%{transform:none}}
.tface{
  width:var(--w);height:calc(var(--w) * 1.4);border-radius:calc(var(--w) * .1);
  position:relative;display:grid;place-items:center;flex:none;
  box-shadow:0 6px 18px rgba(0,0,0,.4);
}
.tface.face{background:var(--face);border:2px solid var(--thread);color:var(--black);font-family:var(--font-display)}
.tface.face.red{color:var(--red)}
.tface .sym{font-size:calc(var(--w) * .82);line-height:1;margin-top:-4%}
.tface .rv,.tface .tag,.tface .kq{
  position:absolute;font-family:var(--font-ui);font-weight:700;line-height:1;
  font-size:calc(var(--w) * .16);color:var(--on-accent);background:var(--thread);
  border-radius:999px;padding:.25em .5em;
}
.tface .rv{left:6%;top:5%}
.tface .tag{right:6%;bottom:5%}
.tface .kq{left:6%;bottom:5%;letter-spacing:.05em}
.tface.down{
  border:2px solid var(--face);
  background:
    repeating-linear-gradient(45deg, rgba(233,185,73,.5) 0 1px, transparent 1px 6px),
    repeating-linear-gradient(-45deg, rgba(233,185,73,.5) 0 1px, transparent 1px 6px),
    var(--madder);
}
.tface.down span{font-family:var(--font-display);color:var(--thread);font-size:calc(var(--w) * .42);line-height:1}
.tface.plaque{
  background:var(--thread);color:var(--on-accent);border:2px solid var(--face);
  font-weight:700;text-align:center;font-size:calc(var(--w) * .17);line-height:1.15;padding:8%;
}
.tface.plaque small{display:block;font-weight:500;font-size:.8em;margin-top:.4em}
.tface.plaque .arrows{display:block;font-size:2.1em;line-height:1;margin-bottom:.15em}
.corner .cap{font-size:12px;font-weight:600;color:var(--on-cloth);text-align:center;line-height:1.25;max-width:120px}
.corner .cap small{display:block;font-weight:400;color:var(--on-cloth-soft);font-size:11px}
.corner .cap em{display:block;font-style:normal;color:var(--thread);font-size:11px;margin-top:1px;white-space:nowrap}
@media (max-width:640px){ .seat.w,.seat.e{top:58%} .who small{display:none} }

/* round scoreboard on the board */
.bscore{
  position:absolute;right:32px;top:30px;z-index:2;width:clamp(100px, 17vw, 170px);
  background:rgba(8,12,34,.6);border:1px solid rgba(255,255,255,.14);border-radius:12px;
  padding:7px 10px 8px;font-size:12px;line-height:1.35;color:var(--on-cloth);
}
.bscore:empty{display:none}
.bscore .ttl{display:flex;justify-content:space-between;gap:6px;color:var(--on-cloth-soft)}
.bscore .ttl b{color:var(--thread);font-weight:700}
.bscore .ttl.stakes span{color:var(--on-cloth);font-weight:600}
.bscore .tm{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-top:5px}
.bscore .tm span{display:flex;align-items:center;gap:5px;white-space:nowrap;min-width:0}
.bscore .tm b{font-family:var(--font-display);font-weight:400;font-size:21px;line-height:1}
.bscore .tm.them .dot{background:var(--them)}
.bscore .tm small{color:var(--on-cloth-soft);font-size:10px}
.bscore .bar{height:4px;border-radius:2px;background:rgba(255,255,255,.15);margin-top:3px;overflow:hidden}
.bscore .bar i{display:block;height:100%;background:var(--thread)}
.bscore .tm .short{display:none}
.bscore .flag{margin-top:6px;padding-top:5px;border-top:1px solid rgba(255,255,255,.14);font-size:11px;color:var(--thread);font-weight:600}
.bscore b.bump{animation:bump .6s ease-out;display:inline-block}
@media (max-width:640px){
  .bscore{right:24px;top:24px;width:94px;padding:6px 8px;font-size:11px}
  .bscore .tm .long,.bscore .tm small{display:none}
  .bscore .tm .short{display:inline}
  .bscore .tm b{font-size:18px}
}

/* marriage announcement */
.mflyer{display:flex;flex-direction:column;align-items:center;gap:12px}
.mflyer .pair{display:flex;padding:0 10px}
.mflyer .pair .card{--w:clamp(72px, 16vw, 112px);box-shadow:0 14px 34px rgba(0,0,0,.45)}
.mflyer .pair .card:first-child{transform:rotate(-10deg) translateY(4px)}
.mflyer .pair .card + .card{transform:rotate(9deg);margin-left:-26%}
.mlabel{
  background:var(--thread);color:var(--on-accent);border-radius:14px;padding:7px 16px;
  font-weight:700;font-size:16px;text-align:center;line-height:1.25;box-shadow:0 10px 26px rgba(0,0,0,.4);
}
.mlabel small{display:block;font-weight:500;font-size:13px}
.btn.quiet{background:transparent;border-color:var(--rule);color:var(--ink-soft);margin-left:auto}
.btn.quiet:hover{color:var(--ink)}
.btn.quiet:disabled{opacity:.5}

/* flying cards */
.fly-layer{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.flyer{position:fixed;left:0;top:0;will-change:transform}
.flyer .card{box-shadow:0 4px 10px rgba(0,0,0,.3)}
.reveal{perspective:1100px;--w:clamp(120px, 26vw, 190px)}
.reveal .rv-inner{position:relative;width:var(--w);height:calc(var(--w) * 1.4);transform-style:preserve-3d}
.reveal .rv-side{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.reveal .rv-side .tface{width:100%;height:100%;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.reveal .rv-front{transform:rotateY(180deg)}
.center-note{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;
  text-align:center;color:var(--on-cloth-soft);font-size:14px;max-width:60%;
}
.center-note b{display:block;font-family:var(--font-display);font-weight:400;font-size:22px;color:var(--on-cloth)}
.center-note .bidmsg{display:block;font-family:var(--font-display);font-size:clamp(26px, 5vw, 40px);line-height:1.15;color:var(--thread);margin-bottom:6px;white-space:nowrap}
.center-note .bidmsg.pass{color:var(--on-cloth)}
.chip.say{font-size:14px;line-height:1.5;padding:0 10px}
@media (max-width:640px){
  .center-note{top:42%;max-width:62%}
  .center-note .bidmsg{white-space:normal;font-size:26px}
}

/* ---------- cards ---------- */
.card{
  --w:var(--cw);
  width:var(--w);height:calc(var(--w) * 1.4);flex:none;padding:0;
  border-radius:calc(var(--w) * .1);position:relative;
  background:var(--face);border:1px solid var(--face-edge);
  box-shadow:0 2px 6px rgba(0,0,0,.22);
  color:var(--black);font-family:var(--font-display);
  user-select:none;
}
.card.red{color:var(--red)}
.card .ix{
  position:absolute;top:6%;left:8%;display:flex;flex-direction:column;align-items:center;
  line-height:.95;font-size:calc(var(--w) * .31);
}
.card .ix i{font-style:normal;font-size:calc(var(--w) * .24)}
.card .pip{
  position:absolute;right:8%;bottom:5%;line-height:1;
  font-size:calc(var(--w) * .56);
}
.card .pt{
  position:absolute;right:9%;top:6%;font-family:var(--font-ui);font-weight:600;
  font-size:calc(var(--w) * .17);line-height:1.2;color:var(--face-soft);
}
.card.back{
  background:
    repeating-linear-gradient(45deg, rgba(233,185,73,.5) 0 1px, transparent 1px 6px),
    repeating-linear-gradient(-45deg, rgba(233,185,73,.5) 0 1px, transparent 1px 6px),
    var(--madder);
  border:2px solid var(--face);
}
/* ---------- action bar ---------- */
.actions{
  background:var(--paper);border:1px solid var(--rule);border-radius:16px;
  padding:10px 14px;min-height:62px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.prompt{margin:0;font-weight:500;flex:1 1 220px}
.prompt small{display:block;color:var(--ink-soft);font-weight:400;font-size:13px}
.stepper{display:flex;align-items:center;border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--paper-2)}
.stepper button{border:0;background:none;width:38px;height:38px;font-size:20px;line-height:1}
.stepper button:disabled{opacity:.3}
.stepper output{min-width:44px;text-align:center;font-family:var(--font-display);font-size:22px;line-height:38px;padding-top:4px}
.modes{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.mode{
  border:1px solid var(--rule);background:var(--paper-2);border-radius:10px;
  padding:6px 11px;font-weight:500;font-size:14px;
}
.mode[aria-pressed="true"]{background:var(--cloth);color:#fff;border-color:var(--cloth)}
.trumprow{display:flex;align-items:center;gap:10px;width:100%;flex-wrap:wrap}
.trumprow .hint{flex:1 1 200px;color:var(--ink-soft);font-size:14px}
.thinking::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

/* ---------- hand ---------- */
.handwrap{
  background:var(--paper);border:1px solid var(--rule);border-radius:16px;
  padding:14px 10px 12px;overflow-x:auto;
}
.hand{display:flex;justify-content:center;align-items:flex-end;min-height:calc(var(--hw) * 1.4 + 12px);padding-top:12px}
.hand .card{--w:var(--hw);transition:transform .15s, opacity .15s}
.hand .card + .card{margin-left:clamp(-18px, calc(4vw - 30px), 6px)}
.hand .gap{width:14px;flex:none}
.hand .card.play:hover,.hand .card.play:focus-visible{transform:translateY(-10px)}
.hand .card.dim{opacity:.42;filter:saturate(.6)}
.hand .card.dealt{animation:dealt .38s cubic-bezier(.2,.8,.3,1)}
@keyframes dealt{from{opacity:0;transform:translateY(-40px) rotate(-6deg) scale(.85)}}
.suits{display:flex;gap:6px}
.suitbtn{
  width:46px;height:46px;border-radius:10px;border:1px solid var(--rule);background:var(--face);
  font-size:26px;line-height:1;color:var(--black);font-family:var(--font-display);
}
.suitbtn.red{color:var(--red)}
.suitbtn[aria-pressed="true"]{border-color:var(--thread);box-shadow:0 0 0 3px var(--thread);transform:translateY(-2px)}
.suitbtn:disabled{opacity:.3}

<script>
/* ==ENGINE START== */
const TEST = typeof window === 'undefined';
// Hooks filled in by the multiplayer layer (see the module script below).
// In TEST (Node) every seat is a computer player.
const NET = {
  isHuman: () => false,          // true when a person holds seat s
  ask: null,                     // ask(seat, kind, data, botFallback) -> Promise<answer>
  askAll: null,                  // askAll(kind, data) -> Promise, every seated person clicks continue
  fx: null,                      // fx(name, arg) -> Promise, plays an animation on every screen
  announce: null,                // announce(msg) -> toast on every screen
  snapshot: null,                // snapshot() -> saves match score so another player can take over hosting
  render: () => {},
  timeout: null
};
let HUMAN = -1;                  // seat of the person looking at THIS screen (-1 = spectator)
let NAMES = ['Seat 1','Seat 2','Seat 3','Seat 4']; // labels as this screen shows them ('You' for HUMAN)
const isHuman = s => !TEST && NET.isHuman(s);

// Engine text is written once on the host and shown on every screen, so seat names are
// stored as tokens and turned into "You" / a player's name by loc() on each screen.
const NM = s => '\u0001N' + s + '\u0002';          // "You" or name
const NMl = s => '\u0001n' + s + '\u0002';         // "you" or name
const POSS = s => '\u0001P' + s + '\u0002';        // "Your" or "Name's"
const TEAM = t => '\u0001T' + t + '\u0002';        // "You & Name" or "Name & Name"
function says(s, you, they){ return '\u0001S' + s + '\u0003' + you + '\u0003' + they + '\u0002'; }
function announce(msg){ if (!TEST && NET.announce) NET.announce(msg); }
function fx(name, arg){ return anim(TEST || !NET.fx ? Promise.resolve() : NET.fx(name, arg)); }
function ask(s, kind, data, bot){ return NET.ask(s, kind, data === undefined ? null : data, bot); }
function askAll(kind, data){ return TEST ? Promise.resolve() : NET.askAll(kind, data === undefined ? null : data); }

const SUITS = ['S','H','C','D'];
const SYM = {S:'\u2660\uFE0E', H:'\u2665\uFE0E', D:'\u2666\uFE0E', C:'\u2663\uFE0E'};
const SUIT_NAME = {S:'Spades', H:'Hearts', D:'Diamonds', C:'Clubs'};
const RANKS = ['J','9','A','10','K','Q','8','7'];
const POWER = {J:8,'9':7,A:6,'10':5,K:4,Q:3,'8':2,'7':1};
const PTS = {J:3,'9':2,A:1,'10':1,K:0,Q:0,'8':0,'7':0};
const RANK_NAME = {J:'Jack',Q:'Queen',K:'King',A:'Ace','10':'10','9':'9','8':'8','7':'7'};
const SEAT_CLASS = ['s','e','n','w'];
const MODE = {SUIT:'suit', TREV:'trev', AREV:'arev', ALEAD:'alead', SEVEN:'seven'};
const MODE_LABEL = {suit:'Trump suit', trev:'Trump reverse', arev:'All reverse', alead:'All leading card', seven:'7th card'};
const MODE_DESC = {
  suit:'Pick a suit you hold. It becomes trump and stays hidden until revealed.',
  trev:'Pick a suit you hold. Once trump is revealed, that suit ranks upside down (7 high).',
  arev:'No trump. Once revealed, every suit ranks upside down (7 high, Jack low).',
  alead:'No trump. The highest card of the led suit always wins.',
  seven:'Your 7th card is set aside. Only you see it, and its suit becomes trump.'
};
const WIN_SCORE = 6;

const teamOf = s => s % 2;
const nextSeat = s => (s + 1) % 4;
const partnerOf = s => (s + 2) % 4;
const cardName = c => RANK_NAME[c.r] + ' of ' + SUIT_NAME[c.s];
const short = c => c.r + SYM[c.s];

let SPEED = 1;
let EPOCH = 0;
const ABORT = {abort:true};
let G = null;

function sleep(ms){
  if (TEST) return Promise.resolve();
  const ep = EPOCH;
  return new Promise((res, rej) => (NET.timeout || setTimeout)(() => (ep === EPOCH ? res() : rej(ABORT)), ms * SPEED));
}

/* ----- deck & shuffling ----- */
function makeDeck(){
  const d = [];
  for (const s of SUITS) for (const r of RANKS) d.push({s, r, id: r + s});
  return d;
}
function shuffleFull(d){
  d = d.slice();
  for (let i = d.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [d[i], d[j]] = [d[j], d[i]];
  }
  return d;
}
// imperfect riffle: split near the middle, drop small clumps from the bottom of each half
function riffle(d){
  const half = Math.round(d.length / 2 + (Math.random() * 6 - 3));
  const L = d.slice(0, half), R = d.slice(half), out = [];
  while (L.length || R.length){
    let src;
    if (!L.length) src = R;
    else if (!R.length) src = L;
    else src = Math.random() < L.length / (L.length + R.length) ? L : R;
    const n = Math.min(src.length, 1 + (Math.random() < 0.35 ? 1 : 0) + (Math.random() < 0.12 ? 1 : 0));
    out.push(...src.splice(src.length - n, n).reverse());
  }
  return out.reverse();
}
function lightShuffle(d){
  let x = d.slice();
  const n = 2 + (Math.random() < 0.4 ? 1 : 0);
  for (let i = 0; i < n; i++) x = riffle(x);
  return x;
}
function cutDeck(d){
  const k = 6 + Math.floor(Math.random() * (d.length - 11));
  return d.slice(k).concat(d.slice(0, k));
}

/* ----- match / round state ----- */
function newMatchState(){
  return {
    score:[0,0], roundNo:0, dealer:3, deck:shuffleFull(makeDeck()),
    over:false, winner:-1, log:[], redeals:0, shuffleKind:'full', leftover:[],
    hands:[[],[],[],[]], dealt:[[],[],[],[]], phase:'idle', turn:-1,
    bid:0, bidder:-1, passed:[false,false,false,false], said:['','','',''], duel:[-1,-1], aiEst:[null,null,null,null],
    mode:null, trumpSuit:null, hidden:null, trumpCard:null,
    revealed:false, revealTrick:-1, revealedBy:-1,
    trickNo:0, trick:[], leader:-1, tricksWon:[[],[]], trickHist:[],
    points:[0,0], target:0, marriage:null, mustTrump:-1, played:new Set(), result:null,
    early:null, surrender:null, surrenderLast:[-1,-1], votes:[null,null,null,null], origMode:null, origTrump:null, bidMsg:null,
    contract:'normal', mult:1, declarer:-1, calls:['','','',''], doubledBy:-1, redoubledBy:-1,
    winSeat:-1, surrenderReq:-1, dealNo:0, readyWait:null, freshDeck:false
  };
}
function resetRound(){
  Object.assign(G, {
    hands:[[],[],[],[]], dealt:[[],[],[],[]], phase:'deal', turn:-1,
    bid:0, bidder:-1, passed:[false,false,false,false], said:['','','',''], duel:[-1,-1], aiEst:[null,null,null,null],
    mode:null, trumpSuit:null, hidden:null, trumpCard:null,
    revealed:false, revealTrick:-1, revealedBy:-1,
    trickNo:0, trick:[], leader:-1, tricksWon:[[],[]], trickHist:[],
    points:[0,0], target:0, marriage:null, mustTrump:-1, played:new Set(), result:null,
    early:null, surrender:null, surrenderLast:[-1,-1], votes:[null,null,null,null], origMode:null, origTrump:null, bidMsg:null,
    contract:'normal', mult:1, declarer:-1, calls:['','','',''], doubledBy:-1, redoubledBy:-1,
    winSeat:-1, surrenderReq:-1, readyWait:null
  });
  G.dealNo++;
}
function prepareDeck(){

/* ----- computer players ----- */
function evalHand4(hand){
  const bySuit = {};
  for (const c of hand) (bySuit[c.s] = bySuit[c.s] || []).push(c);
  const maxLen = Math.max(...Object.values(bySuit).map(a => a.length));
  const pts = hand.reduce((a, c) => a + PTS[c.r], 0);
  const jacks = hand.filter(c => c.r === 'J').length;
  const normal = 12.5 + pts * 0.75 + jacks * 0.7 + (maxLen - 1) * 1.4;
  const sevens = hand.filter(c => c.r === '7').length, eights = hand.filter(c => c.r === '8').length;
  const rev = 12 + sevens * 1.6 + eights * 1.0 + (maxLen - 1) * 0.8;
  return Math.round(Math.max(normal, rev) + (Math.random() * 2 - 1));
}
function aiBid(s, o){
  if (G.aiEst[s] === null) G.aiEst[s] = Math.min(24, evalHand4(G.hands[s]));
  let max = G.aiEst[s];
  if (o.vs >= 0 && teamOf(o.vs) === teamOf(s)) max -= 2;
  if (o.canRemain) return G.bid <= max ? {type:'remain'} : {type:'pass'};
  return o.min <= Math.min(28, max) ? {type:'bid', amt:o.min} : {type:'pass'};

function aiChooseTrump(s){
  const h = G.hands[s];

  for (const c of h) (bySuit[c.s] = bySuit[c.s] || []).push(c);
  const suits = Object.keys(bySuit);
  const maxLen = Math.max(...suits.map(k => bySuit[k].length));
  const jacks = h.filter(c => c.r === 'J').length;
  const lowSum = h.reduce((a, c) => a + (9 - POWER[c.r]), 0);
  if (maxLen === 1) return jacks >= 2 ? {mode:MODE.ALEAD} : {mode:MODE.SEVEN};
  if (jacks === 0 && h.every(c => PTS[c.r] === 0) && lowSum >= 24 && Math.random() < 0.6) return {mode:MODE.AREV};

  for (const k of suits){
    const cs = bySuit[k];
    if (cs.length < 2) continue;
    const norm = cs.reduce((a, c) => a + POWER[c.r], 0) + cs.length * 5;
    const rev = cs.reduce((a, c) => a + (9 - POWER[c.r]), 0) + cs.length * 5;

    const unseen = unseenFor(s);
    const tops = cards.filter(c => isTop(c, unseen, t));
    const pool = tops.length ? tops : cards;
    const tr = trumpActive(t) ? G.trumpSuit : null;
    return {card: pool.slice().sort((a, b) => ((b.s === tr) - (a.s === tr)) || (strength(b, t) - strength(a, t)))[0]};
  }

function aiPlay(s, info){

  const keepPair = c => (pairHeld && c.s === tr && (c.r === 'K' || c.r === 'Q')) ? 1 : 0;
  const low = arr => arr.slice().sort((a, b) => (keepPair(a) - keepPair(b)) || (PTS[a.r] - PTS[b.r]) || (strength(a, t) - strength(b, t)))[0];
  const give = arr => arr.slice().sort((a, b) => (keepPair(a) - keepPair(b)) || (PTS[b.r] - PTS[a.r]) || (strength(a, t) - strength(b, t)))[0];

  const led = G.trick[0].card.s;
  const cur = G.trick[trickWinnerIdx(G.trick, t)];

    const top = isTop(cur.card, unseen, t);

    const winners = cards.filter(c => beatsNow(c));

    }
    if (!partnerSafe && winT.length && (trickPts >= 1 || last || Math.random() < 0.35)) return {card: cheapest(winT)};
  }

  const pool = nonT.length ? nonT : cards;

}
function aiLead(s, cards, tr, unseen, keepPair){
  const t = G.trickNo;
  const trActive = trumpActive(t);
  if (trActive && teamOf(s) === teamOf(G.bidder)){
    const topT = cards.filter(c => c.s === G.trumpSuit && isTop(c, unseen, t));
    const oppT = unseen.filter(c => c.s === G.trumpSuit).length;
    if (topT.length && oppT > 0) return topT.sort((a, b) => PTS[b.r] - PTS[a.r])[0];
  }
  const hideT = c => tr && c.s === tr && !G.revealed;
  const sure = cards.filter(c => !hideT(c) && !keepPair(c) && isTop(c, unseen, t) &&
    (!trActive || c.s === G.trumpSuit || unseen.filter(u => u.s === c.s).length >= 2));
  if (sure.length) return sure.sort((a, b) => (PTS[b.r] - PTS[a.r]) || (strength(b, t) - strength(a, t)))[0];

  const counts = {};
  for (const c of pool) counts[c.s] = (counts[c.s] || 0) + 1;
  return pool.slice().sort((a, b) => (PTS[a.r] - PTS[b.r]) || (counts[b.s] - counts[a.s]) || (strength(a, t) - strength(b, t)))[0];

/* ----- flow ----- */
// vis: {only: seat} for a private line, {except: seat} to hide it from one seat
function log(msg, kind, vis){
  const e = {msg, kind: kind || ''};
  if (vis && vis.only !== undefined) e.only = vis.only;
  if (vis && vis.except !== undefined) e.except = vis.except;
  G.log.push(e);
  if (G.log.length > 120) G.log.shift();
  render();
}

async function runMatch(){
  try {
    while (!G.over) await playRound();
  } catch (e){
    if (e !== ABORT) { console.error(e); if (TEST) throw e; }
  }
}
async function playRound(){
  if (!TEST && NET.snapshot) NET.snapshot();
  if (G.roundNo > 0) G.dealer = nextSeat(G.dealer);
  prepareDeck();
  log('Round ' + (G.roundNo + 1) + '. ' + (G.shuffleKind === 'full' ? 'Full shuffle.' : 'Light shuffle.'), 'round');
  while (true){
    resetRound();
    const cutter = (G.dealer + 3) % 4;
    G.deck = cutDeck(G.deck);
    log(says(cutter, 'cut the deck.', 'cuts the deck.') + ' ' + says(G.dealer, 'deal.', 'deals.'));
    await dealAnimated();
    const ok = await biddingPhase();
    if (!ok){ await dismissRound('Everyone passed.'); continue; }
    G.target = G.bid;
    log(says(G.bidder, 'win', 'wins') + ' the bid at ' + G.bid + '.', 'key');
    await trumpPhase();
    await doubleRedoublePhase();
    await dealAnimated();
    if (G.mode === MODE.SEVEN){
      setAsideSeventh();
      if (isHuman(G.bidder)) log('Your 7th card is the ' + cardName(G.hidden) + '. ' + SUIT_NAME[G.hidden.s] + ' is trump.', 'key', {only:G.bidder});
      log(NM(G.bidder) + ' looks at the 7th card.', 'key', isHuman(G.bidder) ? {except:G.bidder} : null);
    }
    const why = redealReason();
    if (why){ await dismissRound(why); continue; }
    await declarePhase();
    break;
  }
  await playPhase();
  await endRound();
}
async function dealAnimated(){
  G.phase = 'deal'; G.turn = -1;
  for (let b = 0; b < 2; b++){
    for (let i = 0; i < 4; i++){
      await fx('deal', (G.dealer + 1 + i) % 4);
      dealOneBatch(i);
      render();
      await sleep(70);
    }
  }
  await sleep(250);
}
async function dismissRound(why){
  G.phase = 'dismissed'; G.turn = -1;
  G.redeals++;
  log('Round dismissed. ' + why, 'alert');
  await askAll('redeal', {why});
  gatherForRedeal();
  log('Redeal with a full shuffle.');
}
// Paired bidding. The earlier player (senior) may bid higher, remain at the current bid, or pass.
// The challenger (junior) must bid higher or pass. A pass is final. When one of the pair passes,
// the next player in order challenges the survivor. The last player standing wins the bid.
async function biddingPhase(){
  G.phase = 'bid';
  const order = [0,1,2,3].map(i => (G.dealer + 1 + i) % 4);
  let senior = order[0], junior = order[1];
  const queue = order.slice(2);
  let toAct = senior;
  while (true){
    const s = toAct;
    const isSenior = s === senior;
    const vs = isSenior ? (junior === undefined ? -1 : junior) : senior;
    const o = {canRemain: isSenior && G.bid > 0, min: G.bid ? G.bid + 1 : 16, vs, opening: G.bid === 0};
    G.turn = s; G.duel = [senior, junior === undefined ? -1 : junior];

    } else {

      act = aiBid(s, o);
    }
    if (act.type === 'bid'){

      G.bid = act.amt; G.bidder = s; G.said[s] = String(act.amt);

      log(says(s, 'bid ' + act.amt + '.', 'bids ' + act.amt + '.'));

      if (toAct === undefined){ render(); return true; }  // last player left opened the bidding

      if (!o.canRemain) throw new Error('Remain not allowed');

      G.bidMsg = {seat:s, text:NM(s) + ' remained at ' + G.bid, kind:'remain', n:(G.bidMsg ? G.bidMsg.n + 1 : 1)};
      log(says(s, 'remain at ' + G.bid + '.', 'remains at ' + G.bid + '.'));

      log(says(s, 'pass.', 'passes.'));

        if (junior === undefined){ render(); return false; } // everyone passed

      if (G.bid > 0){
        if (junior === undefined){ G.bidder = senior; render(); return true; }

// The bidding team's opponents may Double, and the bidding team may then Re-double, based on the

async function doubleRedoublePhase(){
  G.phase = 'calls';
  const team = [G.bidder, partnerOf(G.bidder)];
  const opps = [nextSeat(G.bidder), (G.bidder + 3) % 4];
  for (const s of opps){
    G.turn = s; render();
    let yes;
    if (isHuman(s)) yes = await ask(s, 'double', null, () => aiDouble(s));
    else { await sleep(650); yes = aiDouble(s); }
    G.calls[s] = yes ? 'Double' : 'No double';
    if (yes){
      G.mult = 2; G.doubledBy = s;
      const msg = says(s, 'double.', 'doubles.') + ' The round is worth ±2.';
      log(msg, 'alert'); announce(msg);
      break;
    }
    render();
  }
  if (G.mult === 2){
    for (const s of team){
      G.turn = s; render();
      let yes;
      if (isHuman(s)) yes = await ask(s, 'redouble', null, () => aiRedouble(s));
      else { await sleep(650); yes = aiRedouble(s); }
      G.calls[s] = yes ? 'Re-double' : 'No re-double';
      if (yes){
        G.mult = 4; G.redoubledBy = s;
        const msg = says(s, 're-double.', 're-doubles.') + ' The round is worth ±4.';
        log(msg, 'alert'); announce(msg);
        break;
      }
      render();
    }
  }
  if (G.mult === 1) log('No double. The round is worth ±1.');
  G.turn = -1; render();
  await sleep(700);
}

async function playPhase(){

  const sitOut = G.contract === 'single' ? partnerOf(G.declarer) : -1;

  const seatsPerTrick = sitOut >= 0 ? 3 : 4;
  while (G.trickNo < 8){
    let s = G.leader;
    for (let k = 0; k < seatsPerTrick; k++){
      if (G.surrenderReq >= 0){
        const p = G.surrenderReq;
        G.surrenderReq = -1;
        if (await runSurrender(p)) return;
      }
      G.turn = s;
      render();
      if (await takeTurn(s) === 'surrendered') return;
      render();
      s = seatAfter(s);
    }
    G.turn = -1;
    const wi = trickWinnerIdx(G.trick, G.trickNo);
    G.winSeat = G.trick[wi].seat;
    render();
    await sleep(950);
    await fx('collect', G.winSeat);
    const {w, pts} = finishTrick();
    G.winSeat = -1;
    log(says(w, 'take', 'takes') + ' trick ' + G.trickNo + (pts ? ' (' + pts + ' pt' + (pts > 1 ? 's' : '') + ').' : '.'));

      log(msg, 'key');

    render();

    if (d){
      const bt = teamOf(G.bidder);
      G.early = d;
      let msg;
      const lastW = G.trickHist[G.trickHist.length - 1].winner;
      if (G.contract === 'single') msg = 'Single Hand broken: ' + NM(lastW) + ' won a trick.';
      else msg = 'Round decided: ' + TEAM(bt) + (d === 'made' ? ' already reached ' : ' can no longer reach ') + G.target + '.';
      log(msg, 'key'); announce(msg);
      await sleep(1300);
      return;
    }
    if (await aiSurrenderCheck()) return;
    await sleep(250);
  }

async function aiSurrenderCheck(){
  if (G.trickNo < 5 || G.trickNo >= 8 || G.contract !== 'normal') return false;
  for (const team of [0,1]){
    // only near-hopeless positions, and not every time
    if (G.surrenderLast[team] !== -1 || winChance(team) > 0.02 || Math.random() < 0.7) continue;
    const members = [0,1,2,3].filter(s => teamOf(s) === team && !isHuman(s));
    if (!members.length) continue;
    const p = members.includes(G.bidder) ? G.bidder : members[0];
    if (await runSurrender(p)) return true;
  }
  return false;
}
async function runSurrender(p){
  const team = teamOf(p);
  G.surrenderLast[team] = G.trickNo;
  G.votes = [null,null,null,null];
  G.votes[p] = 'offer';
  const msg = says(p, 'offer', 'offers') + ' to surrender for ' + TEAM(team) + '.';
  log(msg, 'alert'); announce(msg);
  render();
  for (let i = 1; i < 4; i++){
    const v = (p + i) % 4;
    let yes;
    if (isHuman(v)) yes = await ask(v, 'surrender', {proposer:p, team}, () => aiAcceptSurrender(v, team));
    else { await sleep(700); yes = aiAcceptSurrender(v, team); }
    G.votes[v] = yes ? 'yes' : 'no';
    log(says(v, yes ? 'accept.' : 'decline.', yes ? 'accepts.' : 'declines.'));
    render();
    if (!yes){
      announce(says(v, 'declined', 'declined') + ' the surrender. Play continues.');
      await sleep(600);
      G.votes = [null,null,null,null];
      render();
      return false;
    }
  }
  G.surrender = {seat:p, team};
  await sleep(600);
  G.votes = [null,null,null,null];
  return true;
}
async function takeTurn(s){
  let info = legalInfo(s);
  if (info.force){
    const c = doReveal(s, true);
    const msg = POSS(s) + ' 7th card must be played now. Trump revealed: ' + revealText() + '.';
    log(msg, 'key'); announce(msg);
    await fx('reveal');
    await playAnimated(s, c);
    return;
  }
  let bot = !isHuman(s);
  if (!bot){
    let act;
    while (true){
      act = await ask(s, 'play', null, () => ({type:'bot'}));  // a computer plays if the person is away
      if (act.type === 'bot'){ bot = true; break; }
      if (act.type === 'surrender'){
        G.surrenderReq = -1;
        if (await runSurrender(s)) return 'surrendered';
        continue;
      }
      if (act.type === 'reveal'){
        doReveal(s, false);
        const msg = says(s, 'asked', 'asked') + ' to reveal trump: ' + revealText() + '.';
        log(msg, 'key'); announce(msg);
        await fx('reveal');
        continue;
      }
      break;
    }
    if (!bot){ await playAnimated(s, act.card); return; }
  }
  await sleep(550);
  info = legalInfo(s);
  let d = aiPlay(s, info);
  if (d.reveal){
    doReveal(s, false);
    const msg = says(s, 'asked', 'asked') + ' to reveal trump: ' + revealText() + '.';
    log(msg, 'key'); announce(msg);
    await fx('reveal');
    await sleep(250);
    info = legalInfo(s);
    d = aiPlay(s, info);
  }
  if (!info.cards.includes(d.card)) throw new Error('AI illegal play ' + d.card.id);

}

async function endRound(){
  G.phase = 'end'; G.turn = -1;
  const bt = teamOf(G.bidder);
  const teamTricks = G.trickHist.filter(x => teamOf(x.winner) === bt).length;
  const declTricks = G.trickHist.filter(x => x.winner === G.declarer).length;

    // the bidding team taking all 8 tricks, or the defenders shutting them out of all 8
    if ((teamTricks === 8 || teamTricks === 0) && value < 2){ value = 2; autoBot = true; }
  }
  G.score[bt] += made ? value : -value;
  // gather unplayed cards so the next shuffle has the full deck
  G.leftover = [];
  for (const x of G.trick) G.leftover.push(x.card);

  G.trick = [];

  if (G.score[0] >= WIN_SCORE || G.score[1] <= -WIN_SCORE) winTeam = 0;
  else if (G.score[1] >= WIN_SCORE || G.score[0] <= -WIN_SCORE) winTeam = 1;

  if (G.surrender) log(TEAM(G.surrender.team) + ' surrendered. ' + TEAM(bt) + ' ' + delta + '.', made ? 'key' : 'alert');
  else if (G.contract === 'single') log('Single Hand ' + (made ? 'made by ' : 'failed for ') + NM(G.declarer) + ': ' + TEAM(bt) + ' ' + delta + '.', made ? 'key' : 'alert');

    ], {duration:520 * SPEED, easing:'cubic-bezier(.6,0,.3,1)', fill:'forwards'}).finished;
  } catch (e) {}

  ui.marriageAnim = false;

function fmt(n){ return (n > 0 ? '+' : n < 0 ? '\u2212' : '') + Math.abs(n); }
function rulesHTML(){
  return '<h2>How this table plays 29</h2>' +
  '<p>Four players in two teams; partners sit opposite each other. Dealing and play go anticlockwise. Empty seats are played by the computer.</p>' +
  '<h3>Cards and points</h3><p>32 cards, 7 to Ace. Order in every suit: <span class="ranks">J 9 A 10 K Q 8 7</span>. Jack 3, Nine 2, Ace 1, Ten 1, for 28 points in all.</p>' +
  '<h3>Deal and bid</h3><ul><li>4 cards each, in batches of 2. Bids run from 16 to 28.</li>' +
  '<li>The first two players bid against each other. The one who entered later must bid higher or pass. The one who entered earlier may also remain at the current bid.</li>' +
  '<li>A pass is final for the round. When one of the pair passes, the next player challenges the survivor. The last player left wins the bid. If all pass, the round is dismissed.</li>' +
  '<li>The first bidder moves one seat along each round.</li>' +
  '<li>The bidder picks trump, then 4 more cards each are dealt.</li></ul>' +
  '<h3>Trump choices (kept hidden)</h3><ul>' +
  '<li><b>Trump suit:</b> the bidder secretly names a suit they hold. Nothing is set aside.</li>' +
  '<li><b>Trump reverse:</b> as above, but after the reveal the trump suit ranks upside down (7 high). Points stay the same. Marriage allowed.</li>' +
  '<li><b>All reverse:</b> no trump; after the reveal every suit ranks upside down. No marriage.</li>' +
  '<li><b>All leading card:</b> no trump; the highest card of the led suit always wins. No marriage.</li>' +
  '<li><b>7th card:</b> the bidder\u2019s 7th card is set aside; only the bidder sees it. Its suit is trump. Marriage allowed.</li></ul>' +
  '<h3>Play</h3><ul><li>Follow suit if you can. If you can\u2019t, play any card or ask to reveal trump. If you ask and hold a trump, you must play one.</li>' +
  '<li>Reversed ranking starts from the trick after the reveal, never in the reveal trick.</li>' +
  '<li>The revealed trump is shown large in the corner of the board.</li>' +
  '<li>With 7th card, the set-aside card returns to the bidder at the reveal. If it is the bidder\u2019s only card of the led suit, or their last card, it is played and trump is revealed.</li>' +
  '<li>Marriage: K and Q of trump in one hand, shown automatically on the board once trump is revealed and that team has won a trick since. It lowers the bidder\u2019s target by 4 (min 16) or raises it by 4 for the opponents (max 28).</li></ul>' +
  '<h3>Round dismissed and redealt</h3><ul><li>One player holds all four Jacks.</li><li>A trump suit was chosen and neither opponent holds a card of it.</li><li>7th card was chosen and the bidder\u2019s other 7 cards have no J, 9, A or 10 of trump. The 7th card itself doesn\u2019t count.</li></ul>' +
  '<h3>Doubling, and Single Hand</h3><ul>' +
  '<li>After trump is chosen, while each player still holds only 4 cards, the opponents may Double (\u00B12), and then the bidding team may Re-double (\u00B14). The target does not change.</li>' +

  '<li><b>Single Hand:</b> played with no trump. Any trump chosen earlier (including by the 7th card) no longer counts, and the highest card of the led suit wins every trick. The declarer must win all 8 tricks personally and leads first; their partner sits out the hand entirely and does not play. Made +3, failed \u22123, overriding any double or re-double.</li></ul>' +
  '<h3>Ending a round early</h3><ul><li>Once no marriage can change the target, the round ends as soon as the bidding team has reached it or can no longer reach it \u2014 unless one side is still sweeping every trick so far, in which case play continues to see if the sweep completes.</li>' +
  '<li>Any player may offer to surrender for their team. All three other players must accept. If the bidding team surrenders they lose the round\u2019s stakes; if the opponents surrender the bidding team wins them.</li></ul>' +
  '<h3>Scoring and shuffling</h3><ul><li>Bidding team reaches the target: +1 (\u00D72 doubled, \u00D74 re-doubled). Falls short: the same amount minus. Winning every one of the 8 tricks scores +2 instead of +1, and losing every one of the 8 tricks costs \u22122 instead of \u22121, in an undoubled round. First team to +6 wins; a team at \u22126 loses.</li>' +

  });
}

<script type="module">

/* =========================================================

   One player (the host) runs the game engine above. Everyone
   else only sees what their seat is allowed to see: the host
   builds a separate view per seat, encrypted for that player,
   so hands and a hidden trump never travel in the clear.

   played by the built-in computer players.

const myId = getPersistentId();

const HOST_GRACE = 6000;    // how long the host may be gone before someone else takes over
const SUPABASE_CONFIGURED = SUPABASE_URL !== 'YOUR_SUPABASE_PROJECT_URL';

let room = null, roomCode = null;
let ROOM = null;            // public room state, same on every screen
let connectedIds = [];
let VIEW = null;            // non-host: latest {g, prompt, mine}
let myName = '';
const handlers = {};

const cleanName = s => String(s || '').replace(/[<>&"'`\u0000-\u001f]/g, '').trim().slice(0, 16);
try { myName = cleanName(localStorage.getItem('tw29.name')) || ''; } catch (e) {}

const isHost = () => !!ROOM && ROOM.hostId === myId;
const seatOf = id => ROOM ? ROOM.seats.indexOf(id) : -1;
const connected = id => connectedIds.includes(id);

/* ---------- encryption (ECDH P-256 -> AES-GCM) ---------- */
const cryptoOK = !!(globalThis.crypto && crypto.subtle && globalThis.isSecureContext !== false);
let myKeys = null, myPub = null, hostPub = null;

const aesCache = new Map();
const keysReady = (async () => {
  if (!cryptoOK) return;

  const k = jwk.x + '.' + jwk.y;

function b64(buf){
  const u = new Uint8Array(buf); let s = '';
  for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));

async function seal(jwk, text){
  if (!cryptoOK || !myKeys || !jwk) return {p:text};
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, await aesFor(jwk), new TextEncoder().encode(text));
  return {iv:b64(iv), ct:b64(ct)};
}
async function unseal(jwk, box){
  if (box.p !== undefined) return box.p;
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(box.iv)}, await aesFor(jwk), unb64(box.ct));
  return new TextDecoder().decode(pt);

/* ---------- a timer that keeps running when the host's tab is in the background ---------- */
NET.timeout = (() => {
  try {
    const src = 'onmessage=e=>setTimeout(()=>postMessage(e.data),e.data.ms)';
    const w = new Worker(URL.createObjectURL(new Blob([src], {type:'text/javascript'})));
    let n = 0; const cbs = new Map();
    w.onmessage = e => { const f = cbs.get(e.data.id); cbs.delete(e.data.id); if (f) f(); };
    return (fn, ms) => { const id = ++n; cbs.set(id, fn); w.postMessage({id, ms}); return id; };
  } catch (e) { return null; }
})();

/* ---------- names and seats as this screen shows them ---------- */
function displayName(s){
  const id = ROOM && ROOM.seats[s];
  return id ? (ROOM.names[id] || 'Player ' + (s + 1)) : 'Bot ' + (s + 1);
}
function setViewer(h){
  HUMAN = h;
  NAMES = [0,1,2,3].map(s => s === h ? 'You' : displayName(s));
}
NET.isHuman = s => !!(ROOM && ROOM.seats[s]);
NET.seatTag = s => {
  if (!ROOM) return '';
  const id = ROOM.seats[s];
  if (!id) return 'bot';
  return connected(id) ? '' : 'away';
};

/* =========================================================
   HOST: engine hooks
   ========================================================= */
let pendings = {};          // seat -> {id, kind, data, res, rej, bot, awayTimer}
let promptSeq = Math.floor(Math.random() * 1e6) * 1000;

NET.ask = (s, kind, data, bot) => new Promise((res, rej) => {
  pendings[s] = {id:++promptSeq, kind, data, res, rej, bot};
  hostRender(); flushSync();
  watchAway(s);
});
NET.askAll = (kind, data) => {
  const seats = [0,1,2,3].filter(s => ROOM.seats[s]);
  if (!seats.length) return new Promise((res, rej) => { const ep = EPOCH; setTimeout(() => ep === EPOCH ? res() : rej(ABORT), 4000); });
  return new Promise((res, rej) => {
    const left = new Set(seats);
    G.readyWait = {kind, data, waiting:[...left]};
    for (const s of seats){
      pendings[s] = {id:++promptSeq, kind, data, rej, bot:() => true, res:() => {
        left.delete(s);
        if (G.readyWait) G.readyWait.waiting = [...left];
        if (!left.size){ G.readyWait = null; res(); }
        hostRender();
      }};
    }
    hostRender(); flushSync();
    seats.forEach(watchAway);
  });
};
NET.announce = msg => {
  toast(msg);
  sendChain = sendChain.then(() => room.send('toast', {msg}));
};
NET.fx = (name, arg) => {
  flushSync();
  const n = seq;
  sendChain = sendChain.then(() => room.send('fx', {name, arg, seq:n}));
  return playFx(name, arg);
};
NET.snapshot = () => {
  if (!isHost() || !G) return;
  ROOM = {...ROOM, match:{score:G.score.slice(), roundNo:G.roundNo, dealer:G.dealer, redeals:G.redeals, over:G.over}};
  hostRender();
};
NET.render = () => { if (isHost()) hostRender(); else if (G) renderLocal(); };

function watchAway(s){
  const p = pendings[s];
  if (!p) return;
  const id = ROOM.seats[s];
  if (id && connected(id)){ clearTimeout(p.awayTimer); p.awayTimer = null; return; }
  if (p.awayTimer) return;
  p.awayTimer = setTimeout(() => {
    p.awayTimer = null;
    if (pendings[s] !== p) return;
    const id2 = ROOM.seats[s];
    if (id2 && connected(id2)) return;
    let v;
    try { v = p.bot(); } catch (e) { console.error(e); return; }
    delete pendings[s];
    p.res(v);
    hostRender();
  }, id ? AWAY_GRACE : 500);
}

function validate(s, kind, data, v){
  const hand = G.hands[s];
  switch (kind){
    case 'bid':
      if (!v) return;
      if (v.type === 'pass') return {type:'pass'};
      if (v.type === 'remain') return data.canRemain ? {type:'remain'} : undefined;
      if (v.type === 'bid' && Number.isInteger(v.amt) && v.amt >= data.min && v.amt <= 28) return {type:'bid', amt:v.amt};
      return;
    case 'trump': {
      if (!v || !Object.values(MODE).includes(v.mode)) return;
      const needs = v.mode === MODE.SUIT || v.mode === MODE.TREV;
      if (!needs) return {mode:v.mode, suit:null};
      if (!SUITS.includes(v.suit) || !hand.some(c => c.s === v.suit)) return;
      return {mode:v.mode, suit:v.suit};
    }
    case 'double': case 'redouble': case 'surrender': return !!v;
    case 'declare': return v === 'normal' || v === 'single' ? v : undefined;
    case 'next': case 'over': case 'redeal': return true;
    case 'play': {
      if (!v) return;
      const info = legalInfo(s);
      if (v.type === 'card'){
        const card = hand.find(c => c.id === v.id);
        return card && info.cards.includes(card) ? {type:'card', card} : undefined;
      }
      if (v.type === 'reveal') return info.canReveal ? {type:'reveal'} : undefined;
      if (v.type === 'surrender') return canOfferSurrender(s) ? {type:'surrender'} : undefined;
      return;
    }
  }
}
function canOfferSurrender(s){
  return G.phase === 'play' && !G.surrender && !G.votes.some(v => v) && G.surrenderReq < 0 && G.surrenderLast[teamOf(s)] !== G.trickNo;
}

/* what one seat may see (seat -1 = spectators) */
function viewFor(seat){
  const g = G;
  const bidderSees = seat >= 0 && seat === g.bidder;
  const secret = !g.revealed && g.phase !== 'end' && !bidderSees;
  const v = Object.assign({}, g, {
    deck:[], dealt:[], leftover:[], played:null, aiEst:null,
    hands:g.hands.map((h, s) => s === seat ? h : h.map(() => null)),
    hidden:bidderSees ? g.hidden : null,
    // the 7th card is the bidder's secret until trump is revealed, then everyone sees which card it was
    trumpCard:(bidderSees || g.revealed || g.phase === 'end') ? g.trumpCard : null,
    log:g.log.filter(e => (e.only === undefined || e.only === seat) && e.except !== seat).slice(-60)
  });
  if (secret){
    v.trumpSuit = null;
    if (v.mode && v.mode !== MODE.SEVEN) v.mode = 'hidden';
    if (v.origTrump) v.origTrump = '?';
  }
  return v;
}
function promptFor(s){
  const p = s >= 0 ? pendings[s] : null;
  return p ? {id:p.id, kind:p.kind, data:p.data} : null;
}

let syncTimer = null, seq = 0, sendChain = Promise.resolve();
function hostRender(){
  if (!syncTimer) syncTimer = setTimeout(flushSync, 90);
  renderAll();
}
function flushSync(){
  clearTimeout(syncTimer); syncTimer = null;
  if (!isHost() || !room) return;
  const n = ++seq;
  const roomStr = JSON.stringify(ROOM);
  saveRoomLocally(roomStr);
  let pub = null;
  const seatStrs = [];
  if (ROOM.started && G){
    pub = JSON.stringify({g:viewFor(-1), prompt:null});
    for (let s = 0; s < 4; s++){
      const id = ROOM.seats[s];
      if (!id || id === myId) continue;
      seatStrs.push([s, id, JSON.stringify({g:viewFor(s), prompt:promptFor(s)})]);
    }
  }
  sendChain = sendChain.then(async () => {
    await keysReady;
    const seats = {};
    for (const [s, id, str] of seatStrs){
      if (cryptoOK && !pubKeys[id]) continue;   // their key hasn't arrived yet
      try { seats[s] = {to:id, box:await seal(pubKeys[id], str)}; } catch (e) { console.warn('seal failed', e); }
    }
    room.send('sync', {room:roomStr, pub, seats, hostPub:myPub, seq:n});
  }).catch(e => console.error(e));
}

function stopEngine(){
  EPOCH++;
  const ps = Object.values(pendings);
  pendings = {};
  for (const p of ps){ clearTimeout(p.awayTimer); try { p.rej(ABORT); } catch (e) {} }
  const fly = document.getElementById('fly'); if (fly) fly.innerHTML = '';
}
function startEngine(snap){
  stopEngine();
  G = newMatchState();
  SPEED = ROOM.speed;
  if (snap && !snap.over){
    G.score = snap.score.slice(); G.roundNo = snap.roundNo; G.dealer = snap.dealer; G.redeals = snap.redeals || 0;
    if (G.roundNo > 0) G.freshDeck = true;
    G.log.push({msg:'The host changed. The match score is kept and this round is dealt again.', kind:'round'});
  } else {
    G.log.push({msg:'New match. First to +6 wins.', kind:'round'});
  }
  const ep = EPOCH;
  hostRender(); flushSync();
  runMatch().then(() => { if (ep === EPOCH && isHost() && G && G.over){ ROOM = {...ROOM, match:null}; startEngine(null); } });
}
function becomeHost(){
  ROOM = {...ROOM, hostId:myId, restartVote:null};
  room.send('hello_request', {});
  if (ROOM.started) startEngine(ROOM.match);
  renderAll(); flushSync();
}

/* =========================================================
   PLAYING FX ON ANY SCREEN
   ========================================================= */
function playFx(name, arg){
  if (document.hidden || !G) return Promise.resolve();
  let p;
  switch (name){
    case 'deal': p = animDeal(arg); break;
    case 'play': {
      const from = arg.s === HUMAN ? (ui.lastPlayRect || $('#hand').getBoundingClientRect()) : seatRect(arg.s);
      ui.lastPlayRect = null;
      p = animPlay(arg.s, arg.id, from); break;
    }
    case 'collect': p = animCollect(arg); break;
    case 'reveal': p = animReveal(); break;
    case 'marriage': p = animMarriage(arg); break;
  }
  return Promise.race([Promise.resolve(p).catch(() => {}), wait(6000)]);
}

/* =========================================================
   RENDER DISPATCH
   ========================================================= */
const answered = new Set();
function renderAll(){
  renderScreens();
  if (!ROOM || !ROOM.started) return;
  if (isHost()){
    if (!G) return;
    const me = seatOf(myId);
    setViewer(me);
    SPEED = ROOM.speed;
    pending = promptFor(me);
    const real = G;
    G = viewFor(me);
    try { renderLocal(); } finally { G = real; }
  } else {
    if (!VIEW){ G = null; return; }
    setViewer(VIEW.mine ? seatOf(myId) : -1);
    SPEED = ROOM.speed;
    G = VIEW.g;
    pending = VIEW.prompt && !answered.has(VIEW.prompt.id) ? VIEW.prompt : null;
    renderLocal();
  }
}

const screens = ['screen-home', 'screen-lobby', 'screen-game'];
function showScreen(id){
  for (const s of screens) document.getElementById(s).classList.toggle('hide', s !== id);
}
function renderScreens(){
  document.getElementById('chat-panel').classList.toggle('hide', !ROOM);

}

/* ---------- in-game bar: room code, host tools, reconnect + restart boxes ---------- */

NET.renderBar = () => { if (ROOM && ROOM.started) renderBar(); };
NET.restart = () => { if (isHost()){ showingRestartConfirm = true; renderAll(); } };
NET.toggleSpeed = () => {
  if (!isHost()) return;

  hostRender();
};
NET.answer = (pid, value) => { answered.add(pid); toHost('act', {seat:seatOf(myId), pid, value}); };

/* =========================================================
   NETWORKING
   ========================================================= */
function toHost(event, payload){
  if (isHost()) handlers[event]({...payload, senderId:myId});
  else if (room) room.send(event, payload);
}
function on(event, fn){
  handlers[event] = fn;
  room.on(event, fn);
}
let lastHello = 0;
function sendHello(force){
  if (!room) return;
  const now = Date.now();
  if (!force && now - lastHello < 3000) return;
  lastHello = now;
  room.send('hello', {pub:myPub, name:myName});
}
function saveRoomLocally(str){
  try { sessionStorage.setItem('tw29.room.' + roomCode, str); } catch (e) {}
}

async function setupRoom(){
  await keysReady;
  room = openRoom({gamePrefix:GAME_PREFIX, roomCode, myId});
  let lastHost = null, lastSeq = 0, rx = Promise.resolve();

  on('hello', p => {
    if (p.pub) pubKeys[p.senderId] = p.pub;
    if (!isHost()) return;
    const nm = cleanName(p.name);
    if (nm && ROOM.names[p.senderId] !== nm) ROOM = {...ROOM, names:{...ROOM.names, [p.senderId]:nm}};
    hostRender(); flushSync();
  });
  on('hello_request', () => sendHello(true));

  on('request_sync', p => {
    if (isHost()) { flushSync(); return; }
    // the host reloaded their tab: hand them back the room so they can carry on hosting
    if (ROOM && ROOM.hostId === p.senderId && p.senderId !== myId) room.send('room_state', {room:JSON.stringify(ROOM), to:p.senderId});
  });
  on('room_state', p => {
    if (ROOM || p.to !== myId) return;
    ROOM = JSON.parse(p.room);
    if (ROOM.hostId === myId) becomeHost(); else { renderAll(); checkHost(); }
  });

  on('sync', p => {
    if (p.senderId === myId) return;
    rx = rx.then(async () => {
      const r = JSON.parse(p.room);
      if (isHost() && r.hostId !== myId){
        if (r.hostId < myId){ stopEngine(); G = null; }   // two hosts at once: the lower id keeps it
        else return;
      }
      if (r.hostId !== lastHost){ lastHost = r.hostId; lastSeq = 0; sendHello(true); }
      if (p.seq <= lastSeq) return;
      lastSeq = p.seq;
      if (p.hostPub) hostPub = p.hostPub;
      ROOM = r;
      if (ROOM.started && p.pub){
        const me = seatOf(myId);
        let str = null, mine = false;
        const box = me >= 0 && p.seats ? p.seats[me] : null;
        if (box && box.to === myId){
          try { str = await unseal(hostPub, box.box); mine = true; }
          catch (e) { console.warn('could not open my view', e); sendHello(); }
        } else if (me >= 0) sendHello();
        if (!str) str = p.pub;
        VIEW = JSON.parse(str);
        VIEW.mine = mine;
      } else if (!ROOM.started) VIEW = null;
      renderAll();
      checkHost();
    }).catch(e => console.error(e));
  });
  on('fx', p => {
    if (p.senderId === myId) return;
    rx = rx.then(() => { if (!isHost() && ROOM && ROOM.started && VIEW) return playFx(p.name, p.arg); });
  });
  on('toast', p => {
    if (p.senderId === myId) return;
    rx = rx.then(() => { if (!isHost()) toast(p.msg); });
  });

  // ---- host-only requests ----
  on('act', p => {
    if (!isHost() || !G) return;
    const s = p.seat;
    if (!(s >= 0 && s < 4) || ROOM.seats[s] !== p.senderId) return;
    const pend = pendings[s];
    if (!pend || pend.id !== p.pid) return;
    const v = validate(s, pend.kind, pend.data, p.value);
    if (v === undefined) return;
    delete pendings[s];
    clearTimeout(pend.awayTimer);
    pend.res(v);
    hostRender();
  });
  on('offer_surrender', p => {
    if (!isHost() || !G) return;
    const s = p.seat;
    if (!(s >= 0 && s < 4) || ROOM.seats[s] !== p.senderId || !canOfferSurrender(s)) return;
    const pend = pendings[s];
    if (pend && pend.kind === 'play'){ delete pendings[s]; clearTimeout(pend.awayTimer); pend.res({type:'surrender'}); }
    else G.surrenderReq = s;
    hostRender();
  });
  on('take_seat', p => {
    if (!isHost()) return;
    const s = p.seat, id = p.senderId;
    if (!(s >= 0 && s < 4)) return;
    const cur = ROOM.seats[s];
    const mine = ROOM.seats.indexOf(id);
    if (cur === id) return;
    if (cur && connected(cur)) return;
    const seats = ROOM.seats.slice();
    if (ROOM.started){
      if (mine >= 0) return;
      seats[s] = id;
      ROOM = {...ROOM, seats};
      if (G) log(NM(s) + ' took ' + (cur ? 'back a seat.' : 'over a computer seat.'), 'round');
      watchAway(s);
    } else {
      if (mine >= 0) seats[mine] = null;
      seats[s] = id;
      ROOM = {...ROOM, seats};
    }
    hostRender(); flushSync();
  });
  on('leave_seat', p => {
    if (!isHost() || ROOM.started) return;
    const mine = ROOM.seats.indexOf(p.senderId);
    if (mine < 0) return;
    const seats = ROOM.seats.slice(); seats[mine] = null;
    ROOM = {...ROOM, seats};
    hostRender(); flushSync();
  });
  on('start_game', p => {
    if (!isHost() || ROOM.started || p.senderId !== myId) return;
    if (!ROOM.seats.some(Boolean)) return;
    ROOM = {...ROOM, started:true, match:null, restartVote:null};
    startEngine(null);
  });
  on('restart_propose', p => {
    if (!isHost() || !ROOM.started || ROOM.restartVote || p.senderId !== myId) return;
    const voters = ROOM.seats.filter(id => id && connected(id));
    const votes = {};
    voters.forEach(id => { votes[id] = id === p.senderId ? true : null; });
    if (Object.values(votes).every(v => v)) return doRestart();
    ROOM = {...ROOM, restartVote:{initiatorId:p.senderId, votes}};
    hostRender(); flushSync();
  });
  on('restart_vote', p => {
    if (!isHost() || !ROOM.restartVote || !(p.senderId in ROOM.restartVote.votes)) return;
    if (!p.vote){ ROOM = {...ROOM, restartVote:null}; hostRender(); flushSync(); return; }
    const votes = {...ROOM.restartVote.votes, [p.senderId]:true};
    if (Object.values(votes).every(v => v)) return doRestart();
    ROOM = {...ROOM, restartVote:{...ROOM.restartVote, votes}};
    hostRender(); flushSync();
  });
  on('restart_cancel', p => {
    if (!isHost() || !ROOM.restartVote || ROOM.restartVote.initiatorId !== p.senderId) return;
    ROOM = {...ROOM, restartVote:null};
    hostRender(); flushSync();
  });
  on('send_chat', p => {
    if (!isHost()) return;
    const text = String(p.text || '').slice(0, 240).trim();
    if (!text) return;
    ROOM = {...ROOM, chat:[...ROOM.chat, {senderId:p.senderId, text, ts:Date.now()}].slice(-60)};
    hostRender(); flushSync();
  });

  room.onPresence(({ids}) => {
    connectedIds = ids;
    if (!ROOM) return;
    if (isHost()){
      for (const s of Object.keys(pendings)) watchAway(+s);
      if (ROOM.restartVote){
        // someone who left can't block a restart
        const votes = {};
        for (const [id, v] of Object.entries(ROOM.restartVote.votes)) if (connected(id)) votes[id] = v;
        ROOM = {...ROOM, restartVote:{...ROOM.restartVote, votes}};
        if (Object.values(votes).every(v => v)) doRestart();
      }
      hostRender();
    } else renderAll();
    checkHost();
  });

  await room.connect();
  document.getElementById('share-link').value = location.origin + location.pathname + '?room=' + roomCode;
  setInterval(() => { if (isHost()) flushSync(); }, 10000);
}

function doRestart(){
  ROOM = {...ROOM, restartVote:null, match:null};
  showingRestartConfirm = false;
  startEngine(null);
}

let takeoverTimer = null;
function checkHost(){
  if (!ROOM || connected(ROOM.hostId)){ clearTimeout(takeoverTimer); takeoverTimer = null; return; }
  if (takeoverTimer) return;
  takeoverTimer = setTimeout(() => {
    takeoverTimer = null;
    if (!ROOM || connected(ROOM.hostId)) return;
    const seated = connectedIds.filter(id => ROOM.seats.includes(id));
    const next = seated[0] || connectedIds[0];
    if (next === myId) becomeHost();
  }, HOST_GRACE);
}

/* ---------- create / join ---------- */
const homeErr = document.getElementById('home-err');
function readName(){
  const nm = cleanName(document.getElementById('name-input').value);
  if (!nm){ homeErr.textContent = 'Enter your name first.'; document.getElementById('name-input').focus(); return false; }
  myName = nm;
  try { localStorage.setItem('tw29.name', nm); } catch (e) {}
  return true;
}
function freshRoom(hostId){
  return {hostId, seats:[hostId, null, null, null], names:{[hostId]:myName}, started:false, speed:1, chat:[], match:null, restartVote:null};
}
async function createRoom(){
  homeErr.textContent = '';
  if (!SUPABASE_CONFIGURED){ homeErr.textContent = 'Multiplayer isn\u2019t connected yet.'; return; }
  if (!readName()) return;
  roomCode = makeRoomCode();
  ROOM = freshRoom(myId);
  history.replaceState(null, '', '?room=' + roomCode);
  await setupRoom();
  sendHello(true);
  renderAll(); flushSync();
}
async function joinRoom(code){
  homeErr.textContent = '';
  if (!code){ homeErr.textContent = 'Enter a room code.'; return; }
  if (!SUPABASE_CONFIGURED){ homeErr.textContent = 'Multiplayer isn\u2019t connected yet.'; return; }
  if (!readName()) return;
  roomCode = code;
  ROOM = null; VIEW = null;
  history.replaceState(null, '', '?room=' + roomCode);
  document.getElementById('btn-join').disabled = true;
  homeErr.textContent = 'Connecting\u2026';
  await setupRoom();
  sendHello(true);
  room.send('request_sync', {});
  setTimeout(() => {
    if (ROOM) return;
    // nobody answered: if this tab hosted this room before a reload, pick it back up
    let saved = null;
    try { saved = JSON.parse(sessionStorage.getItem('tw29.room.' + roomCode) || 'null'); } catch (e) {}
    if (saved){ ROOM = saved; if (ROOM.hostId === myId) becomeHost(); else { renderAll(); checkHost(); } }
    else { homeErr.textContent = 'No one answered in room ' + roomCode + ' yet. Check the code; still listening\u2026'; room.send('request_sync', {}); }
  }, 3000);
}

/* ---------- wiring ---------- */
document.getElementById('name-input').value = myName;
document.getElementById('btn-create').onclick = createRoom;
document.getElementById('btn-join-open').onclick = () => { document.getElementById('join-form').classList.remove('hide'); document.getElementById('join-code').focus(); };
document.getElementById('btn-join').onclick = () => joinRoom(document.getElementById('join-code').value.trim().toUpperCase());
document.getElementById('join-code').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('btn-join').click(); });
document.getElementById('btn-copy-link').onclick = () => {
  const el = document.getElementById('share-link');
  el.select();
  if (navigator.clipboard) navigator.clipboard.writeText(el.value).then(() => toast('Link copied'), () => {});
};
document.getElementById('btn-stand').onclick = () => toHost('leave_seat', {});
document.getElementById('btn-start').onclick = () => toHost('start_game', {});
document.getElementById('btn-pace').onclick = () => NET.toggleSpeed();
document.getElementById('btn-lobby-rules').onclick = () => { ui.rules = true; showRules(); };
document.addEventListener('click', e => {
  const l = e.target.closest('[data-lobby], [data-net]');
  if (!l || l.disabled) return;
  const act = l.dataset.lobby || l.dataset.net;
  switch (act){
    case 'sit': case 'claim': toHost('take_seat', {seat:+l.dataset.seat}); break;
    case 'restart-yes': showingRestartConfirm = false; toHost('restart_propose', {}); renderAll(); break;
    case 'restart-no': showingRestartConfirm = false; renderAll(); break;
    case 'vote-yes': toHost('restart_vote', {vote:true}); break;
    case 'vote-no': toHost('restart_vote', {vote:false}); break;
    case 'restart-cancel': toHost('restart_cancel', {}); break;
  }
});
// rules sheet from the lobby (the game's own sheet needs a running game)
function showRules(){
  const ov = $('#overlay'), sh = $('#sheet');
  setHTML(sh, rulesHTML() + '<div class="foot"><button class="primary" id="lobby-rules-close">Close</button></div>');
  ov.hidden = false;
  document.getElementById('lobby-rules-close').onclick = () => { ui.rules = false; ov.hidden = true; };
}

document.getElementById('chat-toggle').onclick = () => {
  const body = document.getElementById('chat-body');
  body.classList.toggle('hide');
  if (!body.classList.contains('hide')){
    const box = document.getElementById('chat-messages');
    box._seen = box._key;
    document.getElementById('chat-toggle').classList.remove('unread');
    box.scrollTop = box.scrollHeight;
    document.getElementById('chat-input').focus();
  }
};
function sendChatMessage(){
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text || !room) return;
  toHost('send_chat', {text});
  input.value = '';
}
document.getElementById('chat-send').onclick = sendChatMessage;
document.getElementById('chat-input').addEventListener('keydown', e => { if (e.key === 'Enter') sendChatMessage(); });

document.addEventListener('visibilitychange', () => { if (!document.hidden && ROOM) renderAll(); });

const urlRoom = new URLSearchParams(location.search).get('room');
if (urlRoom){
  document.getElementById('join-code').value = urlRoom.toUpperCase();
  document.getElementById('join-form').classList.remove('hide');
  if (myName) joinRoom(urlRoom.toUpperCase());
  else homeErr.textContent = 'Enter your name, then press Join.';
}
showScreen('screen-home');
</script>
